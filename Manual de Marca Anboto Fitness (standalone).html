document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

blanco */\n\n  /* Acentos — misma L/C, distinto matiz */\n  --ember:      oklch(0.66 0.16 47);     /* #E16C34 brasa / energía */\n  --ember-deep: oklch(0.55 0.15 42);\n  --moss:       oklch(0.62 0.12 150);    /* #3E8B5C larre / comunidad */\n\n  --maxw: 1180px;\n  --gut: clamp(20px, 5vw, 88px);\n\n  --ff-display: 'Archivo', system-ui, sans-serif;\n  --ff-body:    'Archivo', system-ui, sans-serif;\n  --ff-mono:    'Space Mono', ui-monospace, monospace;\n}\n\n*{ box-sizing:border-box; margin:0; padding:0; }\nhtml{ scroll-behavior:smooth; }\nbody{\n  font-family:var(--ff-body);\n  background:var(--limestone);\n  color:var(--ink);\n  -webkit-font-smoothing:antialiased;\n  text-rendering:optimizeLegibility;\n  line-height:1.5;\n}\nimg{ max-width:100%; display:block; }\n\n/* ---------- Tipografía base ---------- */\n.kicker{\n  font-family:var(--ff-mono);\n  font-size:12px;\n  letter-spacing:0.32em;\n  text-transform:uppercase;\n  color:var(--granite);\n  display:inline-flex;\n  align-items:center;\n  gap:.7em;\n}\n.kicker .dot{ width:6px; height:6px; background:var(--ember); border-radius:50%; flex:none; }\n.kicker--moss .dot{ background:var(--moss); }\n\nh1,h2,h3,h4{ font-family:var(--ff-display); font-weight:800; line-height:1.0; letter-spacing:-0.02em; text-wrap:balance; }\n.display{\n  font-weight:900;\n  font-size:clamp(48px, 11vw, 150px);\n  line-height:0.88;\n  letter-spacing:-0.035em;\n  text-transform:uppercase;\n}\nh2.sec-title{\n  font-size:clamp(34px, 6.2vw, 80px);\n  line-height:0.92;\n  letter-spacing:-0.03em;\n  text-transform:uppercase;\n}\n.eus{ color:var(--ember); }\n.lede{\n  font-size:clamp(18px, 2.4vw, 27px);\n  line-height:1.4;\n  font-weight:500;\n  max-width:30ch;\n  letter-spacing:-0.01em;\n  text-wrap:pretty;\n}\np{ text-wrap:pretty; }\n.body-txt{ font-size:16.5px; line-height:1.6; color:var(--ink); max-width:62ch; }\n.body-txt.muted{ color:var(--granite); }\n.small{ font-size:13.5px; line-height:1.55; color:var(--granite); }\nstrong{ font-weight:700; }\n\n/* ---------- Layout ---------- */\n.wrap{ max-width:var(--maxw); margin-inline:auto; padding-inline:var(--gut); }\nsection{ position:relative; }\n.band-light{ background:var(--limestone); color:var(--ink); }\n.band-stone{ background:var(--stone); color:var(--ink); }\n.band-ink{ background:var(--ink); color:var(--limestone); }\n.band-ink .body-txt{ color:var(--mist); }\n.band-ink .small{ color:var(--granite); }\n.band-ink .kicker{ color:var(--mist); }\n.pad{ padding-block:clamp(72px,11vw,150px); }\n\n.sec-head{ display:flex; flex-direction:column; gap:22px; margin-bottom:clamp(40px,6vw,72px); }\n.sec-num{\n  font-family:var(--ff-mono);\n  font-size:13px; letter-spacing:0.2em; color:var(--granite);\n}\n.sec-num b{ color:var(--ember); font-weight:700; }\n.rule{ height:1px; background:var(--mist); border:0; width:100%; }\n.band-ink .rule{ background:oklch(0.34 0.008 70); }\n\n/* ---------- Header / nav ---------- */\n.topbar{\n  position:sticky; top:0; z-index:50;\n  background:color-mix(in oklab, var(--limestone) 86%, transparent);\n  backdrop-filter:blur(10px);\n  border-bottom:1px solid var(--mist);\n}\n.topbar .wrap{ display:flex; align-items:center; justify-content:space-between; height:60px; }\n.topbar .brand{ font-family:var(--ff-mono); font-size:12px; letter-spacing:0.18em; text-transform:uppercase; display:flex; gap:.6em; align-items:center; white-space:nowrap; }\n.topbar .brand .pk{ width:0; height:0; border-left:7px solid transparent; border-right:7px solid transparent; border-bottom:12px solid var(--ember); }\n.topnav{ display:flex; gap:18px; }\n.topnav a{ font-family:var(--ff-mono); font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--granite); text-decoration:none; white-space:nowrap; }\n.topnav a:hover{ color:var(--ink); }\n@media(max-width:1060px){ .topnav{ display:none; } }\n\n/* ---------- Cover ---------- */\n.cover{ background:var(--ink); color:var(--limestone); min-height:100svh; display:flex; flex-direction:column; overflow:hidden; }\n.cover .wrap{ flex:1; display:flex; flex-direction:column; justify-content:space-between; padding-block:32px 48px; }\n.cover-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; }\n.cover-top .kicker{ color:var(--mist); }\n.cover-mid{ display:flex; flex-direction:column; gap:30px; }\n.cover .display{ color:var(--limestone); }\n.cover .display .eus{ color:var(--ember); }\n.cover-logo{ width:clamp(120px,15vw,180px); opacity:.96; }\n.cover-meta{ display:flex; flex-wrap:wrap; gap:14px 40px; align-items:flex-end; justify-content:space-between; }\n.meta-tags{ display:flex; flex-wrap:wrap; gap:10px; }\n.tag{\n  font-family:var(--ff-mono); font-size:11px; letter-spacing:0.16em; text-transform:uppercase;\n  border:1px solid oklch(0.4 0.01 70); color:var(--mist);\n  padding:7px 13px; border-radius:100px;\n}\n.tag.ember{ border-color:var(--ember); color:var(--ember); }\n\n/* arch motif */\n.arch{ border-radius:1000px 1000px 0 0; }\n\n/* ---------- TOC ---------- */\n.toc-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:0; border-top:1px solid var(--mist); }\n.toc-item{\n  display:flex; align-items:baseline; gap:18px;\n  padding:22px 4px; border-bottom:1px solid var(--mist);\n  text-decoration:none; color:var(--ink);\n}\n.toc-item:nth-child(odd){ border-right:1px solid var(--mist); padding-right:30px; }\n.toc-item:nth-child(even){ padding-left:30px; }\n.toc-item .n{ font-family:var(--ff-mono); font-size:13px; color:var(--ember); width:34px; flex:none; }\n.toc-item .t{ font-family:var(--ff-display); font-weight:700; font-size:20px; letter-spacing:-0.01em; text-transform:uppercase; line-height:1.05; }\n.toc-item .t small{ display:block; font-family:var(--ff-mono); font-weight:400; font-size:11px; letter-spacing:0.12em; color:var(--granite); text-transform:uppercase; margin-top:4px; }\n.toc-item:hover .t{ color:var(--ember); }\n@media(max-width:720px){\n  .toc-grid{ grid-template-columns:1fr; }\n  .toc-item:nth-child(odd){ border-right:0; padding-right:4px; }\n  .toc-item:nth-child(even){ padding-left:4px; }\n}\n\n/* ---------- Pillars / cards ---------- */\n.cols-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--mist); border:1px solid var(--mist); }\n.band-ink .cols-3{ background:oklch(0.34 0.008 70); border-color:oklch(0.34 0.008 70); }\n.cell{ background:var(--limestone); padding:34px 30px; display:flex; flex-direction:column; gap:14px; }\n.band-ink .cell{ background:var(--ink); }\n.band-stone .cell{ background:var(--stone); }\n.cell .ix{ font-family:var(--ff-mono); font-size:12px; color:var(--ember); letter-spacing:0.15em; }\n.cell h3{ font-size:23px; text-transform:uppercase; letter-spacing:-0.01em; }\n.cell h3 .eus{ display:block; font-size:14px; font-weight:600; color:var(--granite); letter-spacing:0.02em; margin-top:3px; text-transform:none; }\n@media(max-width:760px){ .cols-3{ grid-template-columns:1fr; } }\n\n.cols-2{ display:grid; grid-template-columns:repeat(2,1fr); gap:clamp(30px,5vw,64px); align-items:start; }\n@media(max-width:820px){ .cols-2{ grid-template-columns:1fr; } }\n\n/* ---------- Essence statement ---------- */\n.big-quote{\n  font-family:var(--ff-display); font-weight:800;\n  font-size:clamp(28px,4.6vw,58px); line-height:1.04; letter-spacing:-0.025em;\n  text-transform:uppercase; text-wrap:balance;\n}\n.big-quote .eus{ color:var(--ember); }\n\n/* ---------- Logo lab ---------- */\n.logo-stage{\n  border:1px solid var(--mist); border-radius:6px; background:var(--paper);\n  display:flex; align-items:center; justify-content:center;\n  padding:48px; min-height:300px; position:relative; overflow:hidden;\n}\n.logo-stage.dark{ background:var(--ink); border-color:var(--ink-soft); }\n.logo-stage.ember{ background:var(--ember); border-color:var(--ember); }\n.logo-stage img{ max-width:min(300px,70%); }\n.stage-tag{ position:absolute; top:14px; left:16px; font-family:var(--ff-mono); font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--granite); }\n.logo-stage.dark .stage-tag, .logo-stage.ember .stage-tag{ color:color-mix(in oklab, white 70%, transparent); }\n\n.stage-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }\n@media(max-width:760px){ .stage-grid{ grid-template-columns:1fr; } }\n\n/* clear space diagram */\n.clearspace{ position:relative; background:var(--paper); border:1px solid var(--mist); border-radius:6px; padding:60px; }\n.clearspace .frame{ position:relative; display:inline-block; outline:2px dashed var(--ember); }\n.clearspace img{ width:240px; padding:48px; }\n.cs-mark{ position:absolute; font-family:var(--ff-mono); font-size:11px; color:var(--ember); }\n\n/* refined wordmark (CSS rendered) */\n.wordmark{\n  font-family:var(--ff-display); font-weight:900; letter-spacing:0.02em;\n  text-transform:uppercase; display:inline-flex; align-items:flex-end; gap:0.04em; line-height:.8;\n}\n.wordmark .peak{ display:inline-block; }\n.wm-sub{ font-family:var(--ff-mono); font-size:0.26em; letter-spacing:0.5em; padding-left:.5em; color:var(--granite); }\n\n/* monogram svg holder */\n.mono-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }\n@media(max-width:760px){ .mono-grid{ grid-template-columns:repeat(2,1fr); } }\n.mono-cell{ aspect-ratio:1; border:1px solid var(--mist); border-radius:6px; display:flex; align-items:center; justify-content:center; padding:22px; background:var(--paper); }\n.mono-cell.dark{ background:var(--ink); border-color:var(--ink-soft); }\n.mono-cell.ember{ background:var(--ember); border-color:var(--ember); }\n.mono-cell svg{ width:78%; height:78%; }\n\n/* do / dont */\n.dd-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }\n@media(max-width:820px){ .dd-grid{ grid-template-columns:1fr; } }\n.dd{ border:1px solid var(--mist); border-radius:6px; overflow:hidden; background:var(--paper); }\n.dd .pane{ height:150px; display:flex; align-items:center; justify-content:center; background:var(--stone); }\n.dd .pane img{ width:62%; }\n.dd .label{ display:flex; align-items:center; gap:10px; padding:14px 16px; border-top:1px solid var(--mist); font-size:13px; }\n.dd .ic{ width:18px; height:18px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:700; }\n.dd .ic.no{ background:oklch(0.55 0.18 25); }\n.dd .ic.yes{ background:var(--moss); }\n\n/* ---------- Color ---------- */\n.swatches{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }\n@media(max-width:900px){ .swatches{ grid-template-columns:repeat(2,1fr); } }\n@media(max-width:520px){ .swatches{ grid-template-columns:1fr; } }\n.sw{ border:1px solid var(--mist); border-radius:8px; overflow:hidden; background:var(--paper); }\n.sw .chip{ height:150px; }\n.sw .info{ padding:16px; display:flex; flex-direction:column; gap:3px; }\n.sw .info .nm{ font-family:var(--ff-display); font-weight:700; font-size:16px; text-transform:uppercase; letter-spacing:0.01em; }\n.sw .info .nm small{ font-weight:500; color:var(--granite); text-transform:none; letter-spacing:0; }\n.sw .info .hex{ font-family:var(--ff-mono); font-size:12px; color:var(--granite); }\n.sw .info .ok{ font-family:var(--ff-mono); font-size:10.5px; color:var(--mist-2,var(--granite)); opacity:.8; }\n\n.ratio{ display:flex; height:64px; border-radius:8px; overflow:hidden; border:1px solid var(--mist); }\n.ratio span{ display:flex; align-items:center; justify-content:center; font-family:var(--ff-mono); font-size:11px; }\n\n/* ---------- Type specimen ---------- */\n.type-row{ display:grid; grid-template-columns:130px 1fr; gap:28px; padding:26px 0; border-bottom:1px solid var(--mist); align-items:baseline; }\n.type-row .meta{ font-family:var(--ff-mono); font-size:11px; letter-spacing:0.1em; color:var(--granite); line-height:1.6; }\n.type-row .meta b{ color:var(--ink); display:block; font-size:13px; }\n@media(max-width:680px){ .type-row{ grid-template-columns:1fr; gap:10px; } }\n.spec-xl{ font-family:var(--ff-display); font-weight:900; font-size:clamp(40px,8vw,84px); line-height:.9; text-transform:uppercase; letter-spacing:-0.03em; }\n.spec-l{ font-family:var(--ff-display); font-weight:800; font-size:34px; line-height:1; letter-spacing:-0.02em; }\n.spec-body{ font-size:17px; line-height:1.6; max-width:54ch; }\n.spec-mono{ font-family:var(--ff-mono); font-size:15px; letter-spacing:0.12em; text-transform:uppercase; }\n.glyphset{ font-family:var(--ff-display); font-weight:800; font-size:clamp(22px,3vw,30px); letter-spacing:0.04em; color:var(--ink); line-height:1.5; word-spacing:.1em; }\n\n/* ---------- Icons / graphic devices ---------- */\n.icon-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:14px; }\n@media(max-width:820px){ .icon-grid{ grid-template-columns:repeat(3,1fr); } }\n.ico{ aspect-ratio:1; border:1px solid var(--mist); border-radius:6px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; background:var(--paper); padding:14px; }\n.ico svg{ width:42px; height:42px; }\n.ico span{ font-family:var(--ff-mono); font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--granite); text-align:center; }\n.icon-line{ fill:none; stroke:var(--ink); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }\n\n.device-arch{\n  background:var(--ink); border-radius:240px 240px 12px 12px;\n  aspect-ratio:3/4; position:relative; overflow:hidden;\n  display:flex; align-items:flex-end;\n}\n\n/* placeholder imagery */\n.ph{\n  position:relative; overflow:hidden; border-radius:6px;\n  background:\n    repeating-linear-gradient(135deg, color-mix(in oklab,var(--granite) 16%, transparent) 0 2px, transparent 2px 11px),\n    var(--stone);\n  display:flex; align-items:flex-end; padding:16px;\n  border:1px solid var(--mist);\n}\n.ph.dark{ background:\n    repeating-linear-gradient(135deg, oklch(0.42 0.008 70) 0 2px, transparent 2px 11px),\n    var(--ink-soft); border-color:var(--ink-soft); }\n.ph .tagp{ font-family:var(--ff-mono); font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--granite); background:var(--paper); padding:5px 9px; border-radius:4px; }\n.ph.dark .tagp{ background:var(--ink); color:var(--mist); }\n\n/* photography grid */\n.photo-grid{ display:grid; grid-template-columns:repeat(12,1fr); gap:14px; }\n.photo-grid .ph{ min-height:160px; }\n.g-a{ grid-column:span 7; min-height:300px!important; }\n.g-b{ grid-column:span 5; }\n.g-c{ grid-column:span 5; }\n.g-d{ grid-column:span 7; }\n.g-full{ grid-column:span 12; }\n@media(max-width:760px){ .photo-grid>*{ grid-column:span 12!important; } }\n\n/* applications */\n.app-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:22px; }\n@media(max-width:820px){ .app-grid{ grid-template-columns:1fr; } }\n.mock{ border:1px solid var(--mist); border-radius:10px; overflow:hidden; background:var(--paper); }\n.mock .cap{ font-family:var(--ff-mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--granite); padding:14px 18px; border-top:1px solid var(--mist); display:flex; justify-content:space-between; }\n\n/* browser mock */\n.brow{ background:var(--ink); }\n.brow .bar{ height:34px; display:flex; align-items:center; gap:7px; padding:0 14px; background:var(--ink-soft); }\n.brow .bar i{ width:10px; height:10px; border-radius:50%; background:oklch(0.45 0.01 70); display:block; }\n.brow .screen{ padding:44px 40px; min-height:300px; display:flex; flex-direction:column; justify-content:center; gap:20px; color:var(--limestone); position:relative; }\n.brow .hero-h{ font-family:var(--ff-display); font-weight:900; font-size:clamp(30px,4.6vw,56px); line-height:.9; text-transform:uppercase; letter-spacing:-0.03em; }\n.btn{ font-family:var(--ff-mono); font-size:12px; letter-spacing:0.14em; text-transform:uppercase; padding:13px 22px; border-radius:6px; display:inline-flex; align-items:center; gap:8px; width:max-content; font-weight:700; }\n.btn.ember{ background:var(--ember); color:#fff; }\n.btn.ghost{ border:1px solid var(--mist); color:var(--limestone); }\n\n/* social mock */\n.ig{ aspect-ratio:1; position:relative; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; padding:26px; }\n.ig.ink{ background:var(--ink); color:var(--limestone); }\n.ig.ember{ background:var(--ember); color:#fff; }\n.ig .igk{ font-family:var(--ff-mono); font-size:10px; letter-spacing:0.2em; text-transform:uppercase; opacity:.85; margin-bottom:auto; }\n.ig .igt{ font-family:var(--ff-display); font-weight:900; font-size:clamp(26px,4vw,40px); line-height:.92; text-transform:uppercase; letter-spacing:-0.02em; }\n\n/* merch */\n.merch{ aspect-ratio:1; border-radius:8px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }\n\n/* tone columns */\n.tone-2{ display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--mist); border:1px solid var(--mist); border-radius:8px; overflow:hidden; }\n@media(max-width:680px){ .tone-2{ grid-template-columns:1fr; } }\n.tone-2 .side{ background:var(--paper); padding:26px; }\n.tone-2 .side h4{ font-size:15px; font-family:var(--ff-mono); font-weight:700; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:16px; display:flex; align-items:center; gap:9px; }\n.tone-2 .side.yes h4{ color:var(--moss); }\n.tone-2 .side.no h4{ color:oklch(0.55 0.18 25); }\n.tone-2 ul{ list-style:none; display:flex; flex-direction:column; gap:12px; }\n.tone-2 li{ font-size:15px; line-height:1.45; padding-left:20px; position:relative; }\n.tone-2 li::before{ content:''; position:absolute; left:0; top:9px; width:7px; height:7px; border-radius:50%; }\n.tone-2 .yes li::before{ background:var(--moss); }\n.tone-2 .no li::before{ background:oklch(0.55 0.18 25); }\n\n.voice-pills{ display:flex; flex-wrap:wrap; gap:10px; }\n.vp{ border:1px solid var(--ink); border-radius:100px; padding:11px 20px; font-family:var(--ff-display); font-weight:700; font-size:15px; text-transform:uppercase; letter-spacing:0.01em; }\n.band-ink .vp{ border-color:var(--mist); }\n.vp .eu{ font-family:var(--ff-mono); font-weight:400; font-size:11px; color:var(--granite); margin-left:8px; letter-spacing:0.08em; text-transform:none; }\n\n/* misc list */\n.featline{ display:flex; gap:16px; padding:18px 0; border-bottom:1px solid var(--mist); align-items:baseline; }\n.featline .n{ font-family:var(--ff-mono); font-size:12px; color:var(--ember); width:30px; flex:none; }\n.featline .h{ font-family:var(--ff-display); font-weight:700; font-size:18px; text-transform:uppercase; letter-spacing:-0.01em; flex:none; width:200px; }\n.featline .d{ font-size:14.5px; color:var(--granite); line-height:1.5; }\n@media(max-width:680px){ .featline{ flex-direction:column; gap:4px; } .featline .h{ width:auto; } }\n\n/* footer */\n.foot{ background:var(--ink); color:var(--limestone); }\n.foot .wrap{ padding-block:80px 50px; }\n.foot-grid{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:40px; align-items:flex-end; }\n.foot a{ color:var(--mist); text-decoration:none; }\n.foot a:hover{ color:var(--ember); }\n.foot .small{ color:var(--granite); }\n\n/* reveal */\n.reveal{ opacity:0; transform:translateY(18px); transition:opacity .7s ease, transform .7s ease; }\n.reveal.in{ opacity:1; transform:none; }\n@media(prefers-reduced-motion:reduce){ .reveal{ opacity:1; transform:none; } }\n\n/* utility */\n.mt-s{ margin-top:18px; } .mt-m{ margin-top:34px; } .mt-l{ margin-top:56px; }\n.flow > * + *{ margin-top:18px; }\n.stack-tight{ display:flex; flex-direction:column; gap:8px; }\n.inline-tags{ display:flex; flex-wrap:wrap; gap:8px; }\n.divider-num{ font-family:var(--ff-mono); font-size:clamp(60px,13vw,150px); font-weight:700; color:transparent; -webkit-text-stroke:1.5px var(--mist); line-height:.8; letter-spacing:-0.02em; }\n.band-ink .divider-num{ -webkit-text-stroke-color:oklch(0.34 0.008 70); }\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n\n<!-- ===================== TOPBAR ===================== -->\n<header class=\"topbar\">\n  <div class=\"wrap\">\n    <div class=\"brand\"><span class=\"pk\"><\u002Fspan> Anboto · Eskuliburua<\u002Fdiv>\n    <nav class=\"topnav\">\n      <a href=\"#esencia\">01 Esentzia<\u002Fa>\n      <a href=\"#posicion\">02 Marka<\u002Fa>\n      <a href=\"#voz\">03 Ahotsa<\u002Fa>\n      <a href=\"#logo\">04 Logoa<\u002Fa>\n      <a href=\"#color\">05 Kolorea<\u002Fa>\n      <a href=\"#tipo\">06 Tipografia<\u002Fa>\n      <a href=\"#grafica\">07 Grafismoa<\u002Fa>\n      <a href=\"#foto\">08 Argazkia<\u002Fa>\n      <a href=\"#apps\">09 Aplikazioak<\u002Fa>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ===================== COVER ===================== -->\n<section class=\"cover\" data-screen-label=\"Portada\">\n  <div class=\"wrap\">\n    <div class=\"cover-top\">\n      <span class=\"kicker\"><span class=\"dot\"><\u002Fspan> Manual de marca · Markaren eskuliburua<\u002Fspan>\n      <span class=\"kicker\">V1.0 — 2026<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"cover-mid\">\n      <img class=\"cover-logo\" src=\"10c740ae-37bc-4f9c-8bad-ef3fdebe7c94\" alt=\"Anboto Fitness\">\n      <h1 class=\"display\">Anboto<br><span class=\"eus\">Fitness<\u002Fspan><\u002Fh1>\n      <p class=\"lede\" style=\"color:var(--mist)\">El monte que entrenamos juntos. Guía visual y verbal para construir la marca.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"cover-meta\">\n      <div class=\"meta-tags\">\n        <span class=\"tag ember\">Iurreta · Bizkaia<\u002Fspan>\n        <span class=\"tag\">Box · Funtzionala<\u002Fspan>\n        <span class=\"tag\">CrossFit · Hyrox<\u002Fspan>\n        <span class=\"tag\">1.331 m<\u002Fspan>\n      <\u002Fdiv>\n      <span class=\"kicker\">Eus / Es<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== INTRO + TOC ===================== -->\n<section class=\"band-light pad\" id=\"indice\">\n  <div class=\"wrap\">\n    <div class=\"cols-2\" style=\"margin-bottom:clamp(48px,7vw,90px)\">\n      <div>\n        <span class=\"kicker\"><span class=\"dot\"><\u002Fspan> Para qué sirve esto · Zertarako<\u002Fspan>\n        <h2 class=\"sec-title mt-s\">Una marca<br>con raíz<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"flow\" style=\"align-self:end\">\n        <p class=\"body-txt\">Este documento recoge la identidad de <strong>Anboto Fitness<\u002Fstrong>: quiénes somos, cómo hablamos y cómo nos vemos. Es la fuente de verdad para que cualquier estudio o agencia construya la web, las redes y los materiales de la marca con coherencia.<\u002Fp>\n        <p class=\"small\">Nota: el nombre <strong>Anboto<\u002Fstrong> se trabaja como definitivo pero el sistema está pensado para resistir un cambio de nombre — el motivo del <em>pico<\u002Fem>, el <em>arco<\u002Fem> y la paleta de piedra funcionan con cualquier wordmark.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <span class=\"kicker\" style=\"display:block; margin-bottom:18px\">Contenido · Aurkibidea<\u002Fspan>\n    <nav class=\"toc-grid\">\n      <a class=\"toc-item\" href=\"#esencia\"><span class=\"n\">01<\u002Fspan><span class=\"t\">Esencia<small>Esentzia · historia y propósito<\u002Fsmall><\u002Fspan><\u002Fa>\n      <a class=\"toc-item\" href=\"#posicion\"><span class=\"n\">02<\u002Fspan><span class=\"t\">Posicionamiento<small>Marka · pilares y promesa<\u002Fsmall><\u002Fspan><\u002Fa>\n      <a class=\"toc-item\" href=\"#voz\"><span class=\"n\">03<\u002Fspan><span class=\"t\">Tono de voz<small>Ahotsa · bilingüe eus / es<\u002Fsmall><\u002Fspan><\u002Fa>\n      <a class=\"toc-item\" href=\"#logo\"><span class=\"n\">04<\u002Fspan><span class=\"t\">Logotipo<small>Logoa · usos y construcción<\u002Fsmall><\u002Fspan><\u002Fa>\n      <a class=\"toc-item\" href=\"#color\"><span class=\"n\">05<\u002Fspan><span class=\"t\">Color<small>Kolorea · paleta y proporción<\u002Fsmall><\u002Fspan><\u002Fa>\n      <a class=\"toc-item\" href=\"#tipo\"><span class=\"n\">06<\u002Fspan><span class=\"t\">Tipografía<small>Tipografia · escala y uso<\u002Fsmall><\u002Fspan><\u002Fa>\n      <a class=\"toc-item\" href=\"#grafica\"><span class=\"n\">07<\u002Fspan><span class=\"t\">Grafismo<small>Grafismoa · iconos y motivos<\u002Fsmall><\u002Fspan><\u002Fa>\n      <a class=\"toc-item\" href=\"#foto\"><span class=\"n\">08<\u002Fspan><span class=\"t\">Fotografía<small>Argazkia · estilo y tratamiento<\u002Fsmall><\u002Fspan><\u002Fa>\n      <a class=\"toc-item\" href=\"#apps\"><span class=\"n\">09<\u002Fspan><span class=\"t\">Aplicaciones<small>Aplikazioak · web, redes, merch<\u002Fsmall><\u002Fspan><\u002Fa>\n      <a class=\"toc-item\" href=\"#cierre\"><span class=\"n\">10<\u002Fspan><span class=\"t\">Contacto<small>Harremana · recursos<\u002Fsmall><\u002Fspan><\u002Fa>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== 01 ESENCIA ===================== -->\n<section class=\"band-ink pad\" id=\"esencia\" data-screen-label=\"01 Esencia\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\"><b>01<\u002Fb> / 10 — Esentzia<\u002Fdiv>\n      <hr class=\"rule\">\n      <span class=\"kicker\"><span class=\"dot\"><\u002Fspan> De dónde venimos · Nondik gatozen<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"cols-2\">\n      <h2 class=\"big-quote\">No elegimos<br>el nombre de un<br><span class=\"eus\">monte<\u002Fspan> por azar.<\u002Fh2>\n      <div class=\"flow\" style=\"align-self:center\">\n        <p class=\"body-txt\"><strong>Anboto<\u002Fstrong> es la montaña más reconocible de Durangaldea: 1.331 metros de roca caliza que se ven desde todo el valle. En la mitología vasca es la morada de <strong>Mari<\u002Fstrong>, la dama de la naturaleza — fuerza, raíz y carácter.<\u002Fp>\n        <p class=\"body-txt\">Esa es nuestra metáfora: entrenar es escalar. Cada quien sube a su ritmo, pero <strong>la cima se conquista en grupo<\u002Fstrong>. Somos un box grande con alma de cuadrilla, en el Polígono Ertzilla de Iurreta, a un paso de la A8.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"cols-3 mt-l\">\n      <div class=\"cell\">\n        <span class=\"ix\">↑ 1.331 m<\u002Fspan>\n        <h3>La roca<span class=\"eus\">Harria · fuerza<\u002Fspan><\u002Fh3>\n        <p class=\"small\">Sólidos, exigentes, sin atajos. La marca transmite esfuerzo real y constancia.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"cell\">\n        <span class=\"ix\">◎ Talde<\u002Fspan>\n        <h3>La cuadrilla<span class=\"eus\">Komunitatea · cercanía<\u002Fspan><\u002Fh3>\n        <p class=\"small\">Aquí te conocen por tu nombre. Cálidos, familiares, de barrio.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"cell\">\n        <span class=\"ix\">△ Gaila<\u002Fspan>\n        <h3>La cima<span class=\"eus\">Helmuga · progreso<\u002Fspan><\u002Fh3>\n        <p class=\"small\">Escalable para todos. Del primer día al primer Hyrox, cada paso cuenta.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== 02 POSICIONAMIENTO ===================== -->\n<section class=\"band-light pad\" id=\"posicion\" data-screen-label=\"02 Posicionamiento\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\"><b>02<\u002Fb> / 10 — Marka<\u002Fdiv>\n      <hr class=\"rule\">\n      <span class=\"kicker\"><span class=\"dot\"><\u002Fspan> Qué somos · Zer garen<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"cols-2\">\n      <div>\n        <h2 class=\"sec-title\">Más que<br>un box, una<br><span class=\"eus\">comunidad<\u002Fspan><\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"flow\" style=\"align-self:end\">\n        <p class=\"lede\" style=\"max-width:34ch\">Centro de entrenamiento funcional — CrossFit, halterofilia, Hyrox y endurance — para todos los niveles, en Iurreta.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- positioning statement -->\n    <div class=\"mt-l\" style=\"border-top:1px solid var(--mist); padding-top:34px\">\n      <div class=\"featline\"><span class=\"n\">→<\u002Fspan><span class=\"h\">Para quién<\u002Fspan><span class=\"d\">Personas del valle que quieren ponerse en forma sin sentirse juzgadas. Desde quien nunca ha pisado un gimnasio hasta atletas que preparan competición.<\u002Fspan><\u002Fdiv>\n      <div class=\"featline\"><span class=\"n\">→<\u002Fspan><span class=\"h\">Qué ofrecemos<\u002Fspan><span class=\"d\">Entrenamiento variado y guiado, con plazas limitadas y un coach pendiente de ti en cada clase. Primera clase siempre gratis.<\u002Fspan><\u002Fdiv>\n      <div class=\"featline\"><span class=\"n\">→<\u002Fspan><span class=\"h\">Qué nos hace distintos<\u002Fspan><span class=\"d\">Box grande con ambiente de cuadrilla, raíz local y precio claro sin permanencia. La montaña como símbolo de esfuerzo compartido.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- promise -->\n    <div class=\"cols-2 mt-l\" style=\"align-items:center; gap:clamp(30px,5vw,80px)\">\n      <div>\n        <span class=\"kicker\"><span class=\"dot\"><\u002Fspan> La promesa · Promesa<\u002Fspan>\n        <p class=\"big-quote mt-s\" style=\"font-size:clamp(26px,3.8vw,44px)\">«Ven como estás.<br><span class=\"eus\">Sube a tu ritmo.<\u002Fspan><br>Llega más lejos.»<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"flow\">\n        <p class=\"body-txt muted\">La promesa es la idea madre de toda comunicación: acogemos a cualquiera (<em>ven como estás<\u002Fem>), respetamos su nivel (<em>a tu ritmo<\u002Fem>) y garantizamos progreso real (<em>más lejos<\u002Fem>).<\u002Fp>\n        <div class=\"inline-tags mt-s\">\n          <span class=\"tag\" style=\"border-color:var(--ink); color:var(--ink)\">Sin permanencia<\u002Fspan>\n          <span class=\"tag\" style=\"border-color:var(--ink); color:var(--ink)\">1ª clase gratis<\u002Fspan>\n          <span class=\"tag\" style=\"border-color:var(--ink); color:var(--ink)\">Plazas limitadas<\u002Fspan>\n          <span class=\"tag\" style=\"border-color:var(--ink); color:var(--ink)\">Coach en cada clase<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== 03 TONO DE VOZ ===================== -->\n<section class=\"band-stone pad\" id=\"voz\" data-screen-label=\"03 Tono de voz\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\"><b>03<\u002Fb> / 10 — Ahotsa<\u002Fdiv>\n      <hr class=\"rule\">\n      <span class=\"kicker\"><span class=\"dot\"><\u002Fspan> Cómo hablamos · Nola hitz egiten dugun<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"cols-2\">\n      <h2 class=\"sec-title\">Hablamos<br>como un<br><span class=\"eus\">colega<\u002Fspan> que sabe<\u002Fh2>\n      <div class=\"flow\" style=\"align-self:end\">\n        <p class=\"body-txt\">Cercano pero competente. Tuteamos siempre, animamos sin gritar y explicamos sin tecnicismos. Nunca hacemos sentir pequeño a quien empieza. La energía está en los verbos, no en los signos de exclamación.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- voice attributes -->\n    <div class=\"mt-l\">\n      <span class=\"kicker\" style=\"display:block; margin-bottom:16px\">Atributos de voz · Ahotsaren ezaugarriak<\u002Fspan>\n      <div class=\"voice-pills\">\n        <span class=\"vp\">Cercano <span class=\"eu\">hurbila<\u002Fspan><\u002Fspan>\n        <span class=\"vp\">Motivador <span class=\"eu\">akuilatzailea<\u002Fspan><\u002Fspan>\n        <span class=\"vp\">Honesto <span class=\"eu\">zintzoa<\u002Fspan><\u002Fspan>\n        <span class=\"vp\">Con raíz <span class=\"eu\">sustraiduna<\u002Fspan><\u002Fspan>\n        <span class=\"vp\">Sin postureo <span class=\"eu\">harrokeriarik gabe<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- bilingual rule -->\n    <div class=\"cols-2 mt-l\" style=\"align-items:start\">\n      <div class=\"flow\">\n        <span class=\"kicker kicker--moss\"><span class=\"dot\"><\u002Fspan> Regla bilingüe · Arau elebiduna<\u002Fspan>\n        <p class=\"body-txt mt-s\">El <strong>castellano<\u002Fstrong> es la lengua base de los textos largos; el <strong>euskera<\u002Fstrong> aparece con naturalidad en titulares, etiquetas, nombres de clases y despedidas. No traducimos todo palabra por palabra: mezclamos como se habla en el valle.<\u002Fp>\n        <div class=\"stack-tight mt-s\">\n          <p class=\"spec-mono\" style=\"font-size:13px; color:var(--ink)\">WOD · Oinarriak · Indarra · Hyrox<\u002Fp>\n          <p class=\"small\">Nombres de clase: se mantienen en euskera cuando ya funcionan así (Oinarriak = fundamentos).<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"flow\">\n        <span class=\"kicker\"><span class=\"dot\"><\u002Fspan> Firmas y remates · Aurkezpenak<\u002Fspan>\n        <div class=\"stack-tight mt-s\">\n          <p class=\"big-quote\" style=\"font-size:clamp(22px,3vw,32px)\">Gora Anboto!<\u002Fp>\n          <p class=\"small\">Remate de comunidad para redes y eventos.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"stack-tight mt-s\">\n          <p class=\"big-quote\" style=\"font-size:clamp(22px,3vw,32px)\">Eskerrik asko,<br><span class=\"eus\">nos vemos en el box.<\u002Fspan><\u002Fp>\n          <p class=\"small\">Cierre cálido para emails y mensajes.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- do / dont -->\n    <div class=\"tone-2 mt-l\">\n      <div class=\"side yes\">\n        <h4>◎ Sí decimos · Bai<\u002Fh4>\n        <ul>\n          <li>«Tu primera clase es gratis. Ven y prueba, sin compromiso.»<\u002Fli>\n          <li>«No hace falta experiencia: empezamos por lo básico, a tu ritmo.»<\u002Fli>\n          <li>«Hoy toca WOD. Cardio, fuerza y buen rollo. Te esperamos.»<\u002Fli>\n          <li>«Aquí te conocemos por tu nombre.»<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"side no\">\n        <h4>✕ No decimos · Ez<\u002Fh4>\n        <ul>\n          <li>«¡¡APÚNTATE YA!! OFERTA LIMITADA 🔥🔥» <span class=\"small\">(grita y vende)<\u002Fspan><\u002Fli>\n          <li>«Optimiza tu rendimiento metabólico cross-funcional.» <span class=\"small\">(jerga vacía)<\u002Fspan><\u002Fli>\n          <li>«Solo para gente fit.» <span class=\"small\">(excluye)<\u002Fspan><\u002Fli>\n          <li>«El mejor box de España.» <span class=\"small\">(fanfarronea)<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== 04 LOGO ===================== -->\n<section class=\"band-light pad\" id=\"logo\" data-screen-label=\"04 Logotipo\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\"><b>04<\u002Fb> / 10 — Logoa<\u002Fdiv>\n      <hr class=\"rule\">\n      <span class=\"kicker\"><span class=\"dot\"><\u002Fspan> El emblema · Ikurra<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"cols-2\">\n      <h2 class=\"sec-title\">Kettlebell<br>+ monte<br><span class=\"eus\">+ arco<\u002Fspan><\u002Fh2>\n      <div class=\"flow\" style=\"align-self:end\">\n        <p class=\"body-txt\">El logotipo actual une tres signos en un emblema: la <strong>pesa rusa<\u002Fstrong> (entrenamiento funcional), la <strong>silueta del monte Anboto<\u002Fstrong> y el <strong>arco<\u002Fstrong> que los contiene. Es un buen punto de partida. La propuesta refinada conserva esos signos pero los limpia y los hace escalables.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- heritage -->\n    <div class=\"mt-l\">\n      <span class=\"kicker\" style=\"display:block; margin-bottom:16px\">Logo actual · Oraingo logoa<\u002Fspan>\n      <div class=\"logo-stage\">\n        <span class=\"stage-tag\">Emblema heredado<\u002Fspan>\n        <img src=\"e3286715-4808-43c0-8929-0795d4a5c868\" alt=\"Logo Anboto heredado\">\n      <\u002Fdiv>\n      <p class=\"small mt-s\">Fortalezas: concepto claro y memorable. A mejorar: la textura agrietada y el detalle del monte se pierden en tamaños pequeños y en bordados; conviene una versión vectorial limpia y un símbolo simplificado para usos reducidos (favicon, redes, merch).<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- refined direction -->\n    <div class=\"mt-l\">\n      <span class=\"kicker kicker--moss\"><span class=\"dot\"><\u002Fspan> Dirección refinada · Bertsio garbitua<\u002Fspan>\n      <h3 class=\"sec-title mt-s\" style=\"font-size:clamp(26px,4vw,46px)\">El pico es la «A»<\u002Fh3>\n      <p class=\"body-txt mt-s\">La idea que articula el rediseño: la <strong>A de Anboto es una montaña<\u002Fstrong>. Un triángulo con el travesaño de la A. De ahí nace un símbolo simple que funciona a cualquier tamaño y un wordmark geométrico coherente con él.<\u002Fp>\n\n      <div class=\"mono-grid mt-m\">\n        <div class=\"mono-cell\">\n          <svg viewBox=\"0 0 100 100\" aria-hidden=\"true\" style=\"color:var(--ink)\">\n            <path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M50 10 L91 88 H9 Z M30 66 H70 V75 H30 Z\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <div class=\"mono-cell dark\">\n          <svg viewBox=\"0 0 100 100\" aria-hidden=\"true\" style=\"color:var(--limestone)\">\n            <path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M50 10 L91 88 H9 Z M30 66 H70 V75 H30 Z\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <div class=\"mono-cell ember\">\n          <svg viewBox=\"0 0 100 100\" aria-hidden=\"true\" style=\"color:#fff\">\n            <path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M50 10 L91 88 H9 Z M30 66 H70 V75 H30 Z\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <div class=\"mono-cell\">\n          <svg viewBox=\"0 0 100 100\" aria-hidden=\"true\">\n            <path fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"4\" stroke-linejoin=\"round\" d=\"M50 14 L87 86 H13 Z\"><\u002Fpath>\n            <path stroke=\"var(--ember)\" stroke-width=\"6\" d=\"M31 66 H69\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"small mt-s\">Símbolo «Pico-A»: positivo, negativo, sobre brasa y versión línea. Construido sólo con un triángulo y el travesaño — sin textura, escalable hasta 16 px.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- lockups -->\n    <div class=\"mt-l\">\n      <span class=\"kicker\"><span class=\"dot\"><\u002Fspan> Versiones del logotipo · Logo-bertsioak<\u002Fspan>\n      <div class=\"stage-grid mt-m\">\n        <div class=\"logo-stage\" style=\"flex-direction:column; gap:14px; min-height:240px\">\n          <span class=\"stage-tag\">Principal · vertical<\u002Fspan>\n          <svg viewBox=\"0 0 100 100\" style=\"width:60px;color:var(--ink)\" aria-hidden=\"true\"><path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M50 10 L91 88 H9 Z M30 66 H70 V75 H30 Z\"><\u002Fpath><\u002Fsvg>\n          <div style=\"text-align:center\">\n            <div class=\"wordmark\" style=\"font-size:34px; color:var(--ink)\">Anboto<\u002Fdiv>\n            <div class=\"wm-sub\" style=\"font-size:9px; padding:0; display:block; margin-top:4px\">F · I · T · N · E · S · S<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"logo-stage\" style=\"min-height:240px\">\n          <span class=\"stage-tag\">Horizontal · lockup<\u002Fspan>\n          <div style=\"display:flex; align-items:center; gap:16px\">\n            <svg viewBox=\"0 0 100 100\" style=\"width:54px;color:var(--ink)\" aria-hidden=\"true\"><path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M50 10 L91 88 H9 Z M30 66 H70 V75 H30 Z\"><\u002Fpath><\u002Fsvg>\n            <div>\n              <div class=\"wordmark\" style=\"font-size:30px; color:var(--ink)\">Anboto<\u002Fdiv>\n              <div class=\"wm-sub\" style=\"font-size:8.5px; padding:0; display:block; margin-top:3px\">FITNESS · IURRETA<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"logo-stage dark\" style=\"min-height:240px\">\n          <span class=\"stage-tag\">Negativo · sobre pizarra<\u002Fspan>\n          <div style=\"display:flex; align-items:center; gap:16px\">\n            <svg viewBox=\"0 0 100 100\" style=\"width:54px;color:var(--limestone)\" aria-hidden=\"true\"><path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M50 10 L91 88 H9 Z M30 66 H70 V75 H30 Z\"><\u002Fpath><\u002Fsvg>\n            <div>\n              <div class=\"wordmark\" style=\"font-size:30px; color:var(--limestone)\">Anboto<\u002Fdiv>\n              <div class=\"wm-sub\" style=\"font-size:8.5px; padding:0; display:block; margin-top:3px; color:var(--mist)\">FITNESS · IURRETA<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- clear space + min size -->\n    <div class=\"cols-2 mt-l\" style=\"align-items:stretch\">\n      <div>\n        <span class=\"kicker\"><span class=\"dot\"><\u002Fspan> Área de respeto · Babes-eremua<\u002Fspan>\n        <div class=\"clearspace mt-s\" style=\"text-align:center; padding:30px\">\n          <div class=\"frame\" style=\"outline-offset:0\">\n            <svg viewBox=\"0 0 100 100\" style=\"width:120px; padding:32px; color:var(--ink)\" aria-hidden=\"true\"><path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M50 10 L91 88 H9 Z M30 66 H70 V75 H30 Z\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <p class=\"small mt-s\">Margen mínimo = altura del travesaño de la «A» (× ) en los cuatro lados. Nada invade ese espacio.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <span class=\"kicker\"><span class=\"dot\"><\u002Fspan> Tamaño mínimo · Gutxieneko neurria<\u002Fspan>\n        <div class=\"clearspace mt-s\" style=\"display:flex; align-items:center; justify-content:center; gap:40px; flex-wrap:wrap; padding:40px 30px\">\n          <div style=\"text-align:center\">\n            <svg viewBox=\"0 0 100 100\" style=\"width:64px;color:var(--ink)\" aria-hidden=\"true\"><path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M50 10 L91 88 H9 Z M30 66 H70 V75 H30 Z\"><\u002Fpath><\u002Fsvg>\n            <p class=\"small mt-s\">Símbolo<br>16 px / 8 mm<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"text-align:center\">\n            <div class=\"wordmark\" style=\"font-size:22px;color:var(--ink)\">Anboto<\u002Fdiv>\n            <p class=\"small mt-s\">Logotipo<br>24 px / 14 mm<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"small mt-s\">Por debajo de estos tamaños se usa solo el símbolo «Pico-A».<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- misuse -->\n    <div class=\"mt-l\">\n      <span class=\"kicker\"><span class=\"dot\"><\u002Fspan> Usos incorrectos · Erabilera okerrak<\u002Fspan>\n      <div class=\"dd-grid mt-m\">\n        <div class=\"dd\"><div class=\"pane\"><svg viewBox=\"0 0 100 100\" style=\"width:54px;color:var(--ink); transform:scaleX(1.7)\" aria-hidden=\"true\"><path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M50 10 L91 88 H9 Z M30 66 H70 V75 H30 Z\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div class=\"label\"><span class=\"ic no\">✕<\u002Fspan> No deformar ni estirar.<\u002Fdiv><\u002Fdiv>\n        <div class=\"dd\"><div class=\"pane\" style=\"background:linear-gradient(120deg,#7b2ff7,#f72fb0)\"><svg viewBox=\"0 0 100 100\" style=\"width:54px;color:#fff\" aria-hidden=\"true\"><path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M50 10 L91 88 H9 Z M30 66 H70 V75 H30 Z\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div class=\"label\"><span class=\"ic no\">✕<\u002Fspan> No usar colores fuera de paleta.<\u002Fdiv><\u002Fdiv>\n        <div class=\"dd\"><div class=\"pane\"><div class=\"ph\" style=\"width:80%;height:80%;border:0\"><svg viewBox=\"0 0 100 100\" style=\"width:54px;color:var(--granite); margin:auto\" aria-hidden=\"true\"><path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M50 10 L91 88 H9 Z M30 66 H70 V75 H30 Z\"><\u002Fpath><\u002Fsvg><\u002Fdiv><\u002Fdiv><div class=\"label\"><span class=\"ic no\">✕<\u002Fspan> No colocar sobre fondos sin contraste.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== 05 COLOR ===================== -->\n<section class=\"band-ink pad\" id=\"color\" data-screen-label=\"05 Color\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\"><b>05<\u002Fb> / 10 — Kolorea<\u002Fdiv>\n      <hr class=\"rule\">\n      <span class=\"kicker\"><span class=\"dot\"><\u002Fspan> La paleta · Kolore-paleta<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"cols-2\">\n      <h2 class=\"sec-title\">Piedra,<br>brasa y<br><span class=\"eus\">larre<\u002Fspan><\u002Fh2>\n      <div class=\"flow\" style=\"align-self:end\">\n        <p class=\"body-txt\">Neutros cálidos de <strong>caliza vasca<\u002Fstrong> como base — nada de blancos fríos ni negros puros. La <strong>brasa<\u002Fstrong> aporta la energía (el amanecer sobre el monte, los CTAs) y el <strong>larre<\u002Fstrong> (verde prado) la cercanía y la naturaleza. Acentos siempre medidos.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- swatches -->\n    <div class=\"swatches mt-l\">\n      <div class=\"sw\"><div class=\"chip\" style=\"background:var(--ink)\"><\u002Fdiv><div class=\"info\"><span class=\"nm\">Pizarra <small>· Arbela<\u002Fsmall><\u002Fspan><span class=\"hex\">#1B1A18<\u002Fspan><span class=\"ok\">oklch(.185 .008 70)<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"sw\"><div class=\"chip\" style=\"background:var(--granite)\"><\u002Fdiv><div class=\"info\"><span class=\"nm\">Granito <small>· Granitoa<\u002Fsmall><\u002Fspan><span class=\"hex\">#6E6960<\u002Fspan><span class=\"ok\">oklch(.55 .012 75)<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"sw\"><div class=\"chip\" style=\"background:var(--mist)\"><\u002Fdiv><div class=\"info\"><span class=\"nm\">Bruma <small>· Lainoa<\u002Fsmall><\u002Fspan><span class=\"hex\">#DAD5CB<\u002Fspan><span class=\"ok\">oklch(.86 .012 85)<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"sw\"><div class=\"chip\" style=\"background:var(--limestone); border-bottom:1px solid var(--mist)\"><\u002Fdiv><div class=\"info\"><span class=\"nm\">Caliza <small>· Kareharria<\u002Fsmall><\u002Fspan><span class=\"hex\">#F6F3EC<\u002Fspan><span class=\"ok\">oklch(.965 .010 85)<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"swatches mt-m\">\n      <div class=\"sw\"><div class=\"chip\" style=\"background:var(--ember)\"><\u002Fdiv><div class=\"info\"><span class=\"nm\" style=\"color:var(--ink)\">Brasa <small>· Txingarra<\u002Fsmall><\u002Fspan><span class=\"hex\">#E16C34<\u002Fspan><span class=\"ok\">oklch(.66 .16 47)<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"sw\"><div class=\"chip\" style=\"background:var(--moss)\"><\u002Fdiv><div class=\"info\"><span class=\"nm\" style=\"color:var(--ink)\">Larre <small>· Larrea<\u002Fsmall><\u002Fspan><span class=\"hex\">#3E8B5C<\u002Fspan><span class=\"ok\">oklch(.62 .12 150)<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"sw\" style=\"grid-column:span 2; display:flex; flex-direction:column; justify-content:center; padding:18px; background:transparent; border-style:dashed\">\n        <p class=\"small\" style=\"color:var(--mist)\"><strong style=\"color:var(--limestone)\">Brasa<\u002Fstrong> y <strong style=\"color:var(--limestone)\">Larre<\u002Fstrong> comparten luminosidad y croma — sólo cambia el matiz. Por eso conviven sin chocar. Brasa es el acento primario (acción, energía); Larre el secundario (comunidad, naturaleza, estados positivos).<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- proportion -->\n    <div class=\"mt-l\">\n      <span class=\"kicker\"><span class=\"dot\"><\u002Fspan> Proporción de uso · Erabilera-proportzioa<\u002Fspan>\n      <div class=\"ratio mt-s\">\n        <span style=\"background:var(--limestone); color:var(--ink); flex:60\"><\u002Fspan>\n        <span style=\"background:var(--ink) \n\n<!-- ===================== 06 TIPOGRAFÍA ===================== -->\n<section class=\"band-light pad\" id=\"tipo\" data-screen-label=\"06 Tipografía\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div class=\"sec-num\"><b>06<\u002Fb> / 10 — Tipografia<\u002Fdiv>\n      <hr class=\"rule\">\n      <span class=\"kicker\"><span class=\"dot\"><\u002Fspan> Las tipografías · Letra-tipoak<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"cols-2\">\n      <h2 class=\"sec-title\">Archivo<br>+<br><span class=\"eus\">Space Mono<\u002Fspan><\u002Fh2>\n      <div class=\"flow\" style=\"align-self:end\">\n        <p class=\"body-txt\"><strong>Archivo<\u002Fstrong> es una grotesca atlética y robusta: muy negra para titulares, legible para cuerpo. <strong>Space Mono<\u002Fstrong> aporta el carácter técnico — etiquetas, datos, horarios, coordenadas — y conecta con el espaciado del «FITNESS» del logo. Ambas, gratuitas en Google Fonts.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"mt-l\">\n      <div class=\"type-row\">\n        <div class=\"meta\"><b>Archivo Black<\u002Fb>900 · Display<br>tracking −3%<\u002Fdiv>\n        <div><div class=\"spec-xl\">Gora gaila<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"type-row\">\n        <div class=\"meta\"><b>Archivo<\u002Fb>800 · Subtítulos<\u002Fdiv>\n        <div><div class=\"spec-l\">Sube a tu ritmo, llega más lejos<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"type-row\">\n        <div class=\"meta\"><b>Archivo<\u002Fb>400 / 500 · Cuerpo<\u002Fdiv>\n        <div><p class=\"spec-body\">Cada día un WOD distinto: gimnasia, halterofilia, cardio. Mismo entrenamiento, distinta intensidad — un principiante y un atleta lo hacen juntos, cada uno a su nivel. Aquí te conocemos por tu nombre.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"type-row\">\n        <div class=\"meta\"><b>Space Mono<\u002Fb>400 / 700 · Datos y etiquetas<\u002Fdiv>\n        <div><p class=\"spec-mono
