<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva tu clase gratuita - Anboto Crossfit</title>
  <link rel="icon" href="/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Barlow', Arial, sans-serif; background: #0d0d0d; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { max-width: 540px; width: 100%; }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo h1 { font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 700; color: #ff6b35; letter-spacing: 2px; text-transform: uppercase; }
    .logo p { color: #999; font-size: 14px; margin-top: 4px; }

    .card { background: #1a1a1a; border-radius: 12px; padding: 32px; border: 1px solid #2a2a2a; }
    .card h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; color: #fff; margin-bottom: 8px; }
    .card .subtitle { color: #999; font-size: 15px; margin-bottom: 24px; }

    .section-title { color: #ff6b35; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }

    .dates { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    .date-btn { background: #252525; border: 2px solid #333; border-radius: 10px; padding: 12px 8px; min-width: 64px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .date-btn:hover { border-color: #ff6b35; background: #2a2a2a; }
    .date-btn.active { border-color: #ff6b35; background: rgba(255, 107, 53, 0.15); }
    .date-btn .day { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; }
    .date-btn .num { font-size: 22px; font-weight: 700; color: #fff; }
    .date-btn .month { font-size: 11px; color: #999; }

    .slots { display: flex; flex-direction: column; gap: 8px; }
    .slot-btn { background: #252525; border: 2px solid #333; border-radius: 10px; padding: 14px 18px; cursor: pointer; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; }
    .slot-btn:hover { border-color: #4caf50; background: #2a2a2a; }
    .slot-btn.active { border-color: #4caf50; background: rgba(76, 175, 80, 0.15); }
    .slot-btn.recommended { border-color: #ff6b35; }
    .slot-btn.recommended:hover { border-color: #ff6b35; background: rgba(255, 107, 53, 0.1); }
    .slot-btn .left { display: flex; flex-direction: column; gap: 2px; }
    .slot-btn .time { font-size: 18px; font-weight: 600; color: #fff; }
    .slot-btn .class-name { font-size: 13px; color: #999; }
    .slot-btn .badge { display: inline-block; background: #ff6b35; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px; margin-left: 8px; }
    .slot-btn .right { text-align: right; }
    .slot-btn .spots { font-size: 13px; color: #4caf50; }
    .slot-btn .spots.few { color: #ff6b35; }

    .class-legend { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .class-legend span { font-size: 12px; color: #999; }
    .class-legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    .dot-oinarriak { background: #4caf50; }
    .dot-wod { background: #ff6b35; }
    .dot-kickbox { background: #9c27b0; }

    .loading { text-align: center; padding: 24px; color: #999; }
    .loading .spinner { width: 32px; height: 32px; border: 3px solid #333; border-top: 3px solid #ff6b35; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg { text-align: center; padding: 20px; color: #ff6b35; }
    .error-msg a { color: #4caf50; }

    .book-btn { width: 100%; padding: 16px; background: #4caf50; color: #fff; border: none; border-radius: 10px; font-size: 18px; font-weight: 700; cursor: pointer; margin-top: 24px; transition: background 0.2s; font-family: 'Barlow', sans-serif; }
    .book-btn:hover { background: #43a047; }
    .book-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

    .confirmation { text-align: center; padding: 20px 0; }
    .confirmation .check { font-size: 48px; color: #4caf50; margin-bottom: 12px; }
    .confirmation h3 { font-size: 22px; color: #fff; margin-bottom: 8px; }
    .confirmation p { color: #999; font-size: 15px; line-height: 1.6; }
    .confirmation .class-info { background: #252525; border-radius: 10px; padding: 16px; margin: 16px 0; }
    .confirmation .class-info .date { font-size: 20px; font-weight: 700; color: #ff6b35; }
    .confirmation .class-info .time { font-size: 24px; font-weight: 700; color: #fff; }

    .existing-booking { text-align: center; padding: 20px 0; }
    .existing-booking p { color: #999; font-size: 15px; line-height: 1.6; }
    .existing-booking .class-info { background: #252525; border-radius: 10px; padding: 16px; margin: 16px 0; }
    .existing-booking .class-info .date { font-size: 20px; font-weight: 700; color: #ff6b35; }
    .existing-booking .class-info .time { font-size: 24px; font-weight: 700; color: #fff; }

    .whatsapp-link { display: inline-block; margin-top: 16px; color: #4caf50; font-weight: 600; text-decoration: none; }
    .whatsapp-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>Anboto Crossfit</h1>
      <p>Clase gratuita</p>
    </div>

    <div class="card" id="main">
      <div class="loading" id="loading-initial">
        <div class="spinner"></div>
        <p>Cargando...</p>
      </div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin;
    let selectedDate = null;
    let selectedClassId = null;
    let selectedTime = null;
    let selectedClassName = null;
    let selectedCanBook = false;
    let signupNombre = null;
    let signupNivel = null;

    const DAYS = ['Dom', 'Lun', 'Mar', 'Mie', 'Jue', 'Vie', 'Sab'];
    const MONTHS = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

    function getToken() {
      const params = new URLSearchParams(window.location.search);
      return params.get('token');
    }

    function formatDate(d) {
      const dayName = DAYS[d.getDay()];
      const dayNum = d.getDate();
      const monthName = MONTHS[d.getMonth()];
      return `${dayName} ${dayNum} ${monthName}`;
    }

    function formatDateISO(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function getNextDays(count) {
      const days = [];
      const now = new Date();
      let d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      while (days.length < count) {
        if (d.getDay() !== 0) { // Skip Sundays
          days.push(new Date(d));
        }
        d.setDate(d.getDate() + 1);
      }
      return days;
    }

    function renderDates(dates) {
      return dates.map(d => {
        const iso = formatDateISO(d);
        const active = selectedDate === iso ? ' active' : '';
        return `<div class="date-btn${active}" data-date="${iso}">
          <div class="day">${DAYS[d.getDay()]}</div>
          <div class="num">${d.getDate()}</div>
          <div class="month">${MONTHS[d.getMonth()]}</div>
        </div>`;
      }).join('');
    }

    function renderSlots(classes) {
      if (!classes.length) {
        return '<div class="error-msg">No hay clases disponibles este dia. Prueba otro dia.</div>';
      }
      return classes.map(c => {
        const time = c.time.substring(0, 5);
        const active = selectedClassId === c.id ? ' active' : '';
        const name = c.name || 'Clase';
        const desc = c.description || '';
        const isRecommended = signupNivel === 'Sin experiencia' && name === 'Oinarriak';
        const recommendedClass = isRecommended ? ' recommended' : '';
        const badge = isRecommended ? '<span class="badge">Recomendado</span>' : '';
        let spotsHtml = '';
        if (c.full) {
          spotsHtml = '<span class="spots" style="color:#f44336;">Completa</span>';
        } else if (c.spots !== null && c.spots !== undefined) {
          const spotsClass = c.spots <= 2 ? ' few' : '';
          spotsHtml = `<span class="spots${spotsClass}">${c.spots} plaza${c.spots !== 1 ? 's' : ''}</span>`;
        } else {
          spotsHtml = '<span class="spots" style="color:#666;">Disponibilidad no disponible</span>';
        }
        return `<div class="slot-btn${active}${recommendedClass}" data-class-id="${c.id || ''}" data-time="${time}" data-name="${name}" data-can-book="${!!c.canBook}">
          <div class="left">
            <span class="time">${time} ${badge}</span>
            <span class="class-name">${name} &middot; ${desc}</span>
          </div>
          <div class="right">
            ${spotsHtml}
          </div>
        </div>`;
      }).join('');
    }

    function renderError(msg) {
      return `<div class="error-msg">
        <p>${msg}</p>
        <a href="https://wa.me/34688661924" class="whatsapp-link">Escribenos por WhatsApp</a>
      </div>`;
    }

    function renderConfirmation(date, time, nombre, className) {
      const [y, m, day] = date.split('-').map(Number);
      const d = new Date(y, m - 1, day);
      return `<div class="confirmation">
        <div class="check">&#10003;</div>
        <h3>Tu clase esta reservada${nombre ? ', ' + nombre : ''}!</h3>
        <div class="class-info">
          <div class="date">${formatDate(d)}</div>
          <div class="time">${time}${className || ''}</div>
        </div>
        <p>Llega 5 minutos antes y dile tu nombre al coach. Te esperamos!</p>
      </div>`;
    }

    function renderExistingBooking(date, time) {
      const [y, m, day] = date.split('-').map(Number);
      const d = new Date(y, m - 1, day);
      return `<div class="existing-booking">
        <h2 style="color: #4caf50; margin-bottom: 12px;">Ya tienes tu clase reservada</h2>
        <div class="class-info">
          <div class="date">${formatDate(d)}</div>
          <div class="time">${time}</div>
        </div>
        <p>Llega 5 minutos antes y dile tu nombre al coach. Te esperamos!</p>
      </div>`;
    }

    async function init() {
      const token = getToken();
      const main = document.getElementById('main');

      if (!token) {
        main.innerHTML = renderError('Enlace no valido.');
        return;
      }

      try {
        const res = await fetch(`${API_URL}/api/booking-status?token=${encodeURIComponent(token)}`);
        const data = await res.json();

        if (!data.valid) {
          const reason = data.reason === 'expired' ? 'Este enlace ha caducado.' : 'Enlace no encontrado.';
          main.innerHTML = renderError(reason);
          return;
        }

        signupNombre = data.nombre;
        signupNivel = data.nivel;

        // If already booked, show existing booking
        if (data.used && data.booking) {
          main.innerHTML = renderExistingBooking(data.booking.class_date, data.booking.class_time);
          return;
        }

        // Show date picker
        const dates = getNextDays(7);
        const html = `
          <h2>Elige tu clase gratuita</h2>
          <p class="subtitle">${data.nombre ? data.nombre + ', e' : 'E'}lige el dia y hora que mejor te vengan</p>
          <div class="section-title">Fecha</div>
          <div class="dates" id="dates">${renderDates(dates)}</div>
          <div id="slots-section" style="display:none;">
            <div class="section-title">Hora</div>
            <div class="class-legend">
              <span><span class="dot dot-oinarriak"></span>Oinarriak (principiantes)</span>
              <span><span class="dot dot-wod"></span>Wod (CrossTraining)</span>
              <span><span class="dot" style="background:#2196f3;"></span>Hyrox</span>
              <span><span class="dot" style="background:#9c27b0;"></span>Haltero / Endurance / Strength</span>
            </div>
            <div class="slots" id="slots"></div>
          </div>
          <button class="book-btn" id="book-btn" disabled>Reservar clase</button>
        `;
        main.innerHTML = html;

        // Bind date clicks
        document.getElementById('dates').addEventListener('click', async (e) => {
          const btn = e.target.closest('.date-btn');
          if (!btn) return;
          const date = btn.dataset.date;
          selectedDate = date;
          selectedClassId = null;
          selectedTime = null;
          document.getElementById('book-btn').disabled = true;

          // Update active state
          document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          // Fetch slots
          const slotsSection = document.getElementById('slots-section');
          const slotsDiv = document.getElementById('slots');
          slotsSection.style.display = 'block';
          slotsDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Cargando horarios...</p></div>';

          try {
            const res = await fetch(`${API_URL}/api/classes?date=${date}`);
            const data = await res.json();

            if (data.error && data.retry) {
              slotsDiv.innerHTML = renderError(data.message || 'Temporalmente no disponible.');
            } else {
              const classes = data.classes || [];
              const realData = data.realData;
              let html = '';
              if (!realData && classes.length > 0) {
                html += '<div style="background:rgba(255,107,53,0.1);border:1px solid rgba(255,107,53,0.3);border-radius:8px;padding:12px;margin-bottom:12px;color:#ff6b35;font-size:13px;">Las reservas para este dia se abren 1-2 dias antes. Este es el horario habitual.</div>';
              }
              html += renderSlots(classes);
              slotsDiv.innerHTML = html;
            }
          } catch {
            slotsDiv.innerHTML = renderError('Error de conexion. Intenta de nuevo.');
          }
        });

        // Bind slot clicks
        document.getElementById('slots').addEventListener('click', (e) => {
          const btn = e.target.closest('.slot-btn');
          if (!btn) return;
          selectedClassId = btn.dataset.classId ? parseInt(btn.dataset.classId) : null;
          selectedTime = btn.dataset.time;
          selectedClassName = btn.dataset.name;
          selectedCanBook = btn.dataset.canBook === 'true';
          document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('book-btn').disabled = !selectedCanBook;
        });

        // Bind book button
        document.getElementById('book-btn').addEventListener('click', async () => {
          if (!selectedDate || !selectedTime) return;
          const btn = document.getElementById('book-btn');
          btn.disabled = true;
          btn.textContent = 'Reservando...';

          try {
            const res = await fetch(`${API_URL}/api/book`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                token,
                classId: selectedClassId,
                date: selectedDate,
                className: selectedClassName,
                classTime: selectedTime,
              })
            });
            const data = await res.json();

            if (data.ok) {
              const className = data.booking.className ? ' (' + data.booking.className + ')' : '';
              main.innerHTML = renderConfirmation(data.booking.date, data.booking.time, data.booking.name, className);
            } else {
              main.innerHTML = renderError(data.error || 'Error al reservar la clase.');
            }
          } catch {
            main.innerHTML = renderError('Error de conexion. Intenta de nuevo.');
          }
        });

      } catch {
        main.innerHTML = renderError('Error de conexion.');
      }
    }

    init();
  </script>
</body>
</html>
