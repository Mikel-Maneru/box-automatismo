<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva tu clase gratuita - Anboto SC</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231B1A18'/%3E%3Cpath fill='%23E16C34' fill-rule='evenodd' d='M50 20 L84 80 H16 Z M34 60 H66 V69 H34 Z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --pizarra:#1B1A18;--granito:#6E6960;--bruma:#DAD5CB;--caliza2:#ECE8DF;--caliza:#F6F3EC;
      --brasa:#E16C34;--brasa-d:#C8551F;--larre:#3E8B5C;--larre-d:#33744C;
      --ff-d:'Archivo',system-ui,sans-serif;--ff-m:'Space Mono',ui-monospace,monospace;
    }
    html{scrollbar-width:none;-ms-overflow-style:none}
    html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
    body{font-family:var(--ff-d);background:var(--caliza);color:var(--pizarra);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;-webkit-font-smoothing:antialiased}
    .container{max-width:540px;width:100%}
    .logo{text-align:center;margin-bottom:28px}
    .logo .pico{width:46px;height:46px;color:var(--pizarra);margin:0 auto 10px;display:block}
    .logo h1{font-family:var(--ff-d);font-size:32px;font-weight:900;color:var(--pizarra);letter-spacing:-.02em;text-transform:uppercase;line-height:1}
    .logo p{font-family:var(--ff-m);color:var(--granito);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-top:8px}

    .card{background:#fff;border-radius:18px;padding:32px;border:1px solid var(--bruma);box-shadow:0 18px 44px -28px rgba(27,26,24,.4)}
    .card h2{font-family:var(--ff-d);font-size:24px;font-weight:900;letter-spacing:-.02em;color:var(--pizarra);margin-bottom:8px}
    .card .subtitle{color:var(--granito);font-size:15px;margin-bottom:24px;font-weight:500}

    .section-title{font-family:var(--ff-m);color:var(--brasa);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;margin-bottom:12px}

    .dates{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
    .date-btn{background:var(--caliza);border:2px solid var(--bruma);border-radius:12px;padding:12px 8px;min-width:64px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s,transform .2s}
    .date-btn:hover{border-color:var(--brasa);transform:translateY(-2px)}
    .date-btn.active{border-color:var(--brasa);background:rgba(225,108,52,.12)}
    .date-btn .day{font-family:var(--ff-m);font-size:11px;color:var(--granito);text-transform:uppercase;letter-spacing:.06em}
    .date-btn .num{font-size:22px;font-weight:900;color:var(--pizarra);letter-spacing:-.02em}
    .date-btn .month{font-family:var(--ff-m);font-size:11px;color:var(--granito)}

    .slots{display:flex;flex-direction:column;gap:8px}
    .slot-btn{background:var(--caliza);border:2px solid var(--bruma);border-radius:12px;padding:14px 18px;cursor:pointer;transition:border-color .2s,background .2s;display:flex;justify-content:space-between;align-items:center}
    .slot-btn:hover{border-color:var(--larre);background:rgba(62,139,92,.07)}
    .slot-btn.active{border-color:var(--larre);background:rgba(62,139,92,.14)}
    .slot-btn.recommended{border-color:var(--brasa)}
    .slot-btn.recommended:hover{border-color:var(--brasa);background:rgba(225,108,52,.08)}
    .slot-btn .left{display:flex;flex-direction:column;gap:2px}
    .slot-btn .time{font-size:18px;font-weight:800;color:var(--pizarra);letter-spacing:-.01em}
    .slot-btn .class-name{font-size:13px;color:var(--granito);font-weight:500}
    .slot-btn .badge{display:inline-block;background:var(--brasa);color:#fff;font-family:var(--ff-m);font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;text-transform:uppercase;letter-spacing:.06em;margin-left:8px}
    .slot-btn .right{text-align:right}
    .slot-btn .spots{font-size:13px;color:var(--larre);font-weight:600}
    .slot-btn .spots.few{color:var(--brasa)}

    .class-legend{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}
    .class-legend span{font-family:var(--ff-m);font-size:11px;color:var(--granito);letter-spacing:.02em}
    .class-legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
    .dot-oinarriak{background:var(--larre)}
    .dot-wod{background:var(--brasa)}
    .dot-kickbox{background:#9c27b0}

    .loading{text-align:center;padding:24px;color:var(--granito)}
    .loading .spinner{width:32px;height:32px;border:3px solid var(--bruma);border-top:3px solid var(--brasa);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
    @keyframes spin{to{transform:rotate(360deg)}}

    .error-msg{text-align:center;padding:20px;color:var(--brasa)}
    .error-msg a{color:var(--larre);font-weight:700}

    .book-btn{width:100%;padding:16px;background:var(--brasa);color:#fff;border:none;border-radius:12px;font-size:18px;font-weight:800;cursor:pointer;margin-top:24px;transition:background .2s,transform .2s;font-family:var(--ff-d)}
    .book-btn:hover{background:var(--brasa-d);transform:translateY(-2px)}
    .book-btn:disabled{background:var(--bruma);color:#fff;cursor:not-allowed;transform:none}

    .confirmation{text-align:center;padding:20px 0}
    .confirmation .check{font-size:48px;color:var(--larre);margin-bottom:12px}
    .confirmation h3{font-family:var(--ff-d);font-size:22px;font-weight:900;color:var(--pizarra);margin-bottom:8px;letter-spacing:-.01em}
    .confirmation p{color:var(--granito);font-size:15px;line-height:1.6}
    .confirmation .class-info{background:var(--caliza2);border-radius:12px;padding:16px;margin:16px 0}
    .confirmation .class-info .date{font-family:var(--ff-m);font-size:18px;font-weight:700;color:var(--brasa)}
    .confirmation .class-info .time{font-size:24px;font-weight:900;color:var(--pizarra);letter-spacing:-.01em}

    .existing-booking{text-align:center;padding:20px 0}
    .existing-booking p{color:var(--granito);font-size:15px;line-height:1.6}
    .existing-booking .class-info{background:var(--caliza2);border-radius:12px;padding:16px;margin:16px 0}
    .existing-booking .class-info .date{font-family:var(--ff-m);font-size:18px;font-weight:700;color:var(--brasa)}
    .existing-booking .class-info .time{font-size:24px;font-weight:900;color:var(--pizarra);letter-spacing:-.01em}

    .whatsapp-link{display:inline-block;margin-top:16px;color:var(--larre);font-weight:700;text-decoration:none}
    .whatsapp-link:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg class="pico" viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M50 10 L91 88 H9 Z M30 66 H70 V75 H30 Z"></path></svg>
      <h1>Anboto SC</h1>
      <p>↑ 1.331 M · Clase gratis</p>
    </div>

    <div class="card" id="main">
      <div class="loading" id="loading-initial">
        <div class="spinner"></div>
        <p>Cargando...</p>
      </div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin;
    let selectedDate = null;
    let selectedClassId = null;
    let selectedTime = null;
    let selectedClassName = null;
    let selectedCanBook = false;
    let signupNombre = null;
    let signupNivel = null;

    const DAYS = ['Dom', 'Lun', 'Mar', 'Mie', 'Jue', 'Vie', 'Sab'];
    const MONTHS = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

    function getToken() {
      const params = new URLSearchParams(window.location.search);
      return params.get('token');
    }

    function formatDate(d) {
      const dayName = DAYS[d.getDay()];
      const dayNum = d.getDate();
      const monthName = MONTHS[d.getMonth()];
      return `${dayName} ${dayNum} ${monthName}`;
    }

    function formatDateISO(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function getNextDays(count) {
      const days = [];
      const now = new Date();
      let d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      while (days.length < count) {
        if (d.getDay() !== 0) { // Skip Sundays
          days.push(new Date(d));
        }
        d.setDate(d.getDate() + 1);
      }
      return days;
    }

    function renderDates(dates) {
      return dates.map(d => {
        const iso = formatDateISO(d);
        const active = selectedDate === iso ? ' active' : '';
        return `<div class="date-btn${active}" data-date="${iso}">
          <div class="day">${DAYS[d.getDay()]}</div>
          <div class="num">${d.getDate()}</div>
          <div class="month">${MONTHS[d.getMonth()]}</div>
        </div>`;
      }).join('');
    }

    function renderSlots(classes) {
      if (!classes.length) {
        return '<div class="error-msg">No hay clases disponibles este dia. Prueba otro dia.</div>';
      }
      return classes.map(c => {
        const time = c.time.substring(0, 5);
        const active = selectedClassId === c.id ? ' active' : '';
        const name = c.name || 'Clase';
        const desc = c.description || '';
        const isRecommended = signupNivel === 'Sin experiencia' && name === 'Oinarriak';
        const recommendedClass = isRecommended ? ' recommended' : '';
        const badge = isRecommended ? '<span class="badge">Recomendado</span>' : '';
        let spotsHtml = '';
        if (c.full) {
          spotsHtml = '<span class="spots" style="color:#f44336;">Completa</span>';
        } else if (c.spots !== null && c.spots !== undefined) {
          const spotsClass = c.spots <= 2 ? ' few' : '';
          spotsHtml = `<span class="spots${spotsClass}">${c.spots} plaza${c.spots !== 1 ? 's' : ''}</span>`;
        } else {
          spotsHtml = '<span class="spots" style="color:#666;">Disponibilidad no disponible</span>';
        }
        return `<div class="slot-btn${active}${recommendedClass}" data-class-id="${c.id || ''}" data-time="${time}" data-name="${name}" data-can-book="${!!c.canBook}">
          <div class="left">
            <span class="time">${time} ${badge}</span>
            <span class="class-name">${name} &middot; ${desc}</span>
          </div>
          <div class="right">
            ${spotsHtml}
          </div>
        </div>`;
      }).join('');
    }

    function renderError(msg) {
      return `<div class="error-msg">
        <p>${msg}</p>
        <a href="https://wa.me/34688661924" class="whatsapp-link">Escribenos por WhatsApp</a>
      </div>`;
    }

    function renderConfirmation(date, time, nombre, className) {
      const [y, m, day] = date.split('-').map(Number);
      const d = new Date(y, m - 1, day);
      return `<div class="confirmation">
        <div class="check">&#10003;</div>
        <h3>Tu clase esta reservada${nombre ? ', ' + nombre : ''}!</h3>
        <div class="class-info">
          <div class="date">${formatDate(d)}</div>
          <div class="time">${time}${className || ''}</div>
        </div>
        <p>Llega 5 minutos antes y dile tu nombre al coach. Te esperamos!</p>
      </div>`;
    }

    function renderExistingBooking(date, time) {
      const [y, m, day] = date.split('-').map(Number);
      const d = new Date(y, m - 1, day);
      return `<div class="existing-booking">
        <h2 style="color: #4caf50; margin-bottom: 12px;">Ya tienes tu clase reservada</h2>
        <div class="class-info">
          <div class="date">${formatDate(d)}</div>
          <div class="time">${time}</div>
        </div>
        <p>Llega 5 minutos antes y dile tu nombre al coach. Te esperamos!</p>
      </div>`;
    }

    async function init() {
      const token = getToken();
      const main = document.getElementById('main');

      if (!token) {
        main.innerHTML = renderError('Enlace no valido.');
        return;
      }

      try {
        const res = await fetch(`${API_URL}/api/booking-status?token=${encodeURIComponent(token)}`);
        const data = await res.json();

        if (!data.valid) {
          const reason = data.reason === 'expired' ? 'Este enlace ha caducado.' : 'Enlace no encontrado.';
          main.innerHTML = renderError(reason);
          return;
        }

        signupNombre = data.nombre;
        signupNivel = data.nivel;

        // If already booked, show existing booking
        if (data.used && data.booking) {
          main.innerHTML = renderExistingBooking(data.booking.class_date, data.booking.class_time);
          return;
        }

        // Show date picker
        const dates = getNextDays(7);
        const html = `
          <h2>Elige tu clase gratuita</h2>
          <p class="subtitle">${data.nombre ? data.nombre + ', e' : 'E'}lige el dia y hora que mejor te vengan</p>
          <div class="section-title">Fecha</div>
          <div class="dates" id="dates">${renderDates(dates)}</div>
          <div id="slots-section" style="display:none;">
            <div class="section-title">Hora</div>
            <div class="class-legend">
              <span><span class="dot dot-oinarriak"></span>Oinarriak (principiantes)</span>
              <span><span class="dot dot-wod"></span>Wod (CrossTraining)</span>
              <span><span class="dot" style="background:#2196f3;"></span>Hyrox</span>
              <span><span class="dot" style="background:#9c27b0;"></span>Haltero / Endurance / Strength</span>
            </div>
            <div class="slots" id="slots"></div>
          </div>
          <button class="book-btn" id="book-btn" disabled>Reservar clase</button>
        `;
        main.innerHTML = html;

        // Bind date clicks
        document.getElementById('dates').addEventListener('click', async (e) => {
          const btn = e.target.closest('.date-btn');
          if (!btn) return;
          const date = btn.dataset.date;
          selectedDate = date;
          selectedClassId = null;
          selectedTime = null;
          document.getElementById('book-btn').disabled = true;

          // Update active state
          document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          // Fetch slots
          const slotsSection = document.getElementById('slots-section');
          const slotsDiv = document.getElementById('slots');
          slotsSection.style.display = 'block';
          slotsDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Cargando horarios...</p></div>';

          try {
            const res = await fetch(`${API_URL}/api/classes?date=${date}`);
            const data = await res.json();

            if (data.error && data.retry) {
              slotsDiv.innerHTML = renderError(data.message || 'Temporalmente no disponible.');
            } else {
              const classes = data.classes || [];
              const realData = data.realData;
              let html = '';
              if (!realData && classes.length > 0) {
                html += '<div style="background:rgba(225,108,52,0.1);border:1px solid rgba(225,108,52,0.3);border-radius:8px;padding:12px;margin-bottom:12px;color:#C8551F;font-size:13px;">Las reservas para este dia se abren 1-2 dias antes. Este es el horario habitual.</div>';
              }
              html += renderSlots(classes);
              slotsDiv.innerHTML = html;
            }
          } catch {
            slotsDiv.innerHTML = renderError('Error de conexion. Intenta de nuevo.');
          }
        });

        // Bind slot clicks
        document.getElementById('slots').addEventListener('click', (e) => {
          const btn = e.target.closest('.slot-btn');
          if (!btn) return;
          selectedClassId = btn.dataset.classId ? parseInt(btn.dataset.classId) : null;
          selectedTime = btn.dataset.time;
          selectedClassName = btn.dataset.name;
          selectedCanBook = btn.dataset.canBook === 'true';
          document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('book-btn').disabled = !selectedCanBook;
        });

        // Bind book button
        document.getElementById('book-btn').addEventListener('click', async () => {
          if (!selectedDate || !selectedTime) return;
          const btn = document.getElementById('book-btn');
          btn.disabled = true;
          btn.textContent = 'Reservando...';

          try {
            const res = await fetch(`${API_URL}/api/book`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                token,
                classId: selectedClassId,
                date: selectedDate,
                className: selectedClassName,
                classTime: selectedTime,
              })
            });
            const data = await res.json();

            if (data.ok) {
              const className = data.booking.className ? ' (' + data.booking.className + ')' : '';
              main.innerHTML = renderConfirmation(data.booking.date, data.booking.time, data.booking.name, className);
            } else {
              main.innerHTML = renderError(data.error || 'Error al reservar la clase.');
            }
          } catch {
            main.innerHTML = renderError('Error de conexion. Intenta de nuevo.');
          }
        });

      } catch {
        main.innerHTML = renderError('Error de conexion.');
      }
    }

    init();
  </script>
</body>
</html>
